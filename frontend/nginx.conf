# 127.0.0.11 é o DNS embutido do Docker — resolver "backend" aqui (em vez de deixar
# o nginx cachear o IP uma vez no boot do worker) evita ter que reiniciar/recarregar
# o frontend sempre que só o container do backend for recriado (ex: deploy isolado
# com `docker compose up -d --no-deps backend`).
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5G;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # style-src precisa de 'unsafe-inline': o player e algumas barras de progresso
    # do admin usam style={{...}} inline do React (ex: Player.tsx, EpisodiosManager.tsx).
    # img-src libera i.ytimg.com: thumbnails importadas de playlist do YouTube são
    # baixadas e salvas localmente (/media/...), mas caem de volta pra hotlink nessa
    # origem se o download falhar (ver download_youtube_thumbnail em media_storage.py).
    # script-src e frame-src liberam youtube.com/*: o player embute vídeos do YouTube
    # via youtube-video-element (react-player), que injeta o script
    # youtube.com/iframe_api na página e o vídeo em si roda num iframe de
    # youtube.com/embed (ou youtube-nocookie.com/embed) — sem isso o player quebra.
    #
    # Checkout de assinatura (AssinaturaCheckout.tsx) usa o Payment Brick do Mercado
    # Pago pra tokenizar cartão sem sair do site: sdk.mercadopago.com carrega o SDK
    # JS; http2.mlstatic.com é o CDN estático usado pelo Brick (fonte/ícones);
    # api.mercadopago.com e api-static.mercadopago.com recebem a tokenização do
    # cartão (POST direto do navegador, nunca passa pelo nosso backend);
    # secure-fields.mercadopago.com é o iframe/troca de mensagens dos campos seguros
    # do cartão (número/CVV nunca tocam nosso DOM); www.mercadopago.com(.br) é a
    # origem de outros iframes que o Brick pode abrir. 'unsafe-inline' em script-src
    # é o bootstrap do Brick, que injeta e executa um <script> inline — não é nosso
    # código, não dá pra trocar por hash (o conteúdo muda a cada versão que o MP
    # publica). O PIX do checkout de assinatura não usa nada disso: é gerado pelo
    # nosso backend (sdk.payment().create no servidor) e mostrado como imagem
    # (data:) + texto, sem chamada nenhuma pro Mercado Pago a partir do navegador.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://sdk.mercadopago.com https://http2.mlstatic.com; style-src 'self' 'unsafe-inline' https://http2.mlstatic.com; font-src 'self' https://http2.mlstatic.com; img-src 'self' data: https://i.ytimg.com; media-src 'self'; connect-src 'self' https://api.mercadopago.com https://sdk.mercadopago.com https://http2.mlstatic.com https://secure-fields.mercadopago.com https://api-static.mercadopago.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.mercadopago.com https://www.mercadopago.com.br https://secure-fields.mercadopago.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Assets do Vite têm hash no nome do arquivo — cache agressivo é seguro.
    # Um location próprio de add_header SUBSTITUI (não soma) o do bloco server,
    # então os headers de segurança acima são repetidos aqui — senão toda
    # resposta debaixo de /assets/ perderia eles silenciosamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://sdk.mercadopago.com https://http2.mlstatic.com; style-src 'self' 'unsafe-inline' https://http2.mlstatic.com; font-src 'self' https://http2.mlstatic.com; img-src 'self' data: https://i.ytimg.com; media-src 'self'; connect-src 'self' https://api.mercadopago.com https://sdk.mercadopago.com https://http2.mlstatic.com https://secure-fields.mercadopago.com https://api-static.mercadopago.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.mercadopago.com https://www.mercadopago.com.br https://secure-fields.mercadopago.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # API do backend — mesma origem do frontend, então o navegador não precisa de CORS
    location /api/ {
        set $backend "backend:8000";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Streaming de vídeo (range requests) e imagens públicas (capas/banners/thumbnails)
    location /media/ {
        set $backend "backend:8000";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 300s;
    }

    # SPA: qualquer rota que não seja um arquivo estático cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
