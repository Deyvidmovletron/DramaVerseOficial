<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="STREAM+ — assista suas séries favoritas quando e onde quiser." />
    <meta property="og:title" content="STREAM+" />
    <meta property="og:description" content="Assista suas séries favoritas quando e onde quiser." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>STREAM+</title>
    <style>
      /* Some antes do bundle JS carregar/parsear, pra não deixar tela branca em conexão lenta. */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0b0b0d;
      }
      #root:empty::after {
        content: "";
        width: 40px;
        height: 40px;
        border-radius: 9999px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-top-color: #e50914;
        animation: stream-plus-spin 0.8s linear infinite;
      }
      @keyframes stream-plus-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
